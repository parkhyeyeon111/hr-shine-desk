*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{

.btb{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bdots{display:flex;gap:5px}
.bd{width:11px;height:11px;border-radius:50%;cursor:pointer}
.bd.r{background:#FF5F57;border:.5px solid #E0443E}
.bd.y{background:#FEBC2E;border:.5px solid #D4A017}
.bd.g{background:#28C840;border:.5px solid #1DAD2B}
.btabs{display:flex;gap:2px}
.btab{display:flex;align-items:center;gap:7px;padding:6px 16px 7px;background:#fff;border:1px solid #CBD5E1;border-bottom:none;border-radius:8px 8px 0 0;font-size:11.5px;font-weight:500;color:var(--t2)}

.pbar{height:6px;background:var(--sky-l);border-radius:4px;overflow:hidden}
.pbar-fill{height:100%;border-radius:4px;transition:width .4s;background:linear-gradient(90deg,var(--sky-d),var(--sky))}
.inp{width:100%;padding:8px 11px;border:1.5px solid var(--border2);border-radius:var(--rs);background:#fff;color:var(--text);font-family:inherit;font-size:12px;outline:none;transition:border .15s}
.inp:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(14,165,233,.1)}
.inp::placeholder{color:var(--t3)}
.inp-lbl{font-size:10.5px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.modal-ov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justifyContent:center;padding:16px;background:rgba(12,74,110,.35);backdrop-filter:blur(4px)}
.modal-box{background:#fff;border-radius:16px;box-shadow:var(--shm),0 0 0 1px var(--border2);max-height:90vh;overflow-y:auto}
.modal-hd{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justifyContent:space-between;background:linear-gradient(135deg,#fff,var(--sky-l))}
.modal-title{font-size:14px;font-weight:800;color:var(--sky-deep)}
.modal-sub{font-size:11px;color:var(--t3);margin-top:2px}
.modal-body{padding:18px 22px}
.tab-bar{display:flex;gap:5px;flex-wrap:wrap}
.tab-btn{padding:5px 13px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border2);background:#fff;color:var(--t3);font-family:inherit;transition:all .15s}
.tab-btn.active{background:var(--sky-l);border-color:var(--sky);color:var(--sky-d)}
.tab-btn:hover:not(.active){background:var(--bg)}
.toast{position:fixed;bottom:20px;right:20px;z-index:200;background:var(--sky-deep);color:#fff;padding:10px 16px;border-radius:10px;font-size:12px;font-weight:600;box-shadow:var(--shm);animation:slidein .25s ease}
@keyframes slidein{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
.fadein{animation:fadein .2s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cl-panel{width:300px;min-width:300px;background:#fff;border-left:2px solid var(--sky-m);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.cl-panel-hd{padding:14px 16px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#fff,var(--sky-l));flex-shrink:0}
.cl-panel-body{flex:1;overflow-y:auto;padding:12px 14px}
.cl-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;margin-bottom:5px;transition:background .12s}
.cl-item:hover{background:var(--sky-l)}
.cl-item.done-item{background:#F0FDF4;border-color:#BBF7D0}
.row-click{cursor:pointer}
select.inp option{background:white;color:var(--text)}
.bdg-indigo{background:#EEF2FF;color:#4338CA;border-color:#C7D2FE}
</style>

<script type="text/babel">
const {useState,useEffect,useMemo,useCallback,useRef}=React;

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const API_URL="https://script.google.com/macros/s/AKfycbzd8dkOgHBHcsauhB4H2ASU_mdJ9aSAS0IZi66kmwHaXy1QJq3sftoRyPjjxaqZamGjLw/exec";
const GTMPL_KEY="hr_v15_gtmpl";
const TODAY=new Date();
const todayStr=TODAY.toISOString().split('T')[0];
const KOR_M=["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];

const fmt=d=>{const dt=d instanceof Date?d:new Date(d);return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`};
const addD=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const nxtM15=d=>{const r=new Date(d);r.setMonth(r.getMonth()+1,15);return r};
const dday=d=>{const n=Math.ceil((new Date(d)-TODAY)/86400000);return n===0?"D-Day":n>0?`D-${n}`:`D+${Math.abs(n)}`};
const nowIso=()=>new Date().toISOString();
const fmtAmt=v=>{if(v===null||v===undefined||String(v).trim()==="")return"—";const n=Number(String(v).replace(/,/g,"").trim());return isNaN(n)?String(v):n.toLocaleString("ko-KR")};
const fmtCell=v=>{
  if(v===null||v===undefined||String(v).trim()==="")return"—";
  const s=String(v).trim();
  if(/^(Sun|Mon|Tue|Wed|Thu|Fri|Sat)\s/.test(s)){
    const d=new Date(s);
    if(!isNaN(d.getTime()))return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }
  if(/^\d{4}-\d{2}-\d{2}T/.test(s)){ return s.slice(0,10); }
  return s;
};
const clKey=(m,t,tp)=>`cl__${(m||"x").replace(/\s/g,"_")}__${(t||"x").replace(/\s/g,"_")}__${(tp||"x").replace(/\s/g,"_")}`;

const DEF_SUBS={"입사":["4대보험 취득 신고","근로계약서 체결","월급여 일할 계산","급여 계좌 등록","시스템 계정 생성","온보딩 안내 발송"],"퇴사":["4대보험 상실 신고","퇴직금 정산","미사용 연차수당 지급","최종 급여 정산","퇴직연금 IRP 이관","사내 시스템 계정 회수"],"육아휴직":["육아휴직 개시일 등록","고용보험 육아휴직 급여 신청","4대보험 납부 유예 확인","급여 중지 처리"],"육아기간 단축근로":["단축근로 시작일 등록","고용보험 급여 지원 신청","급여 단축 계산 확인","근로계약서 변경"],"출산휴가":["출산휴가 개시 신고","건강보험 급여 신청","4대보험 납부 유예 확인","급여 처리 확인"],"복직":["4대보험 복직 처리","급여 재개 확인","근태 시스템 복직 등록","육아휴직 종료 신고"]};
const TYPE_S={"입사":{cls:"bdg-blue",clr:"#1D4ED8",bg:"#EFF6FF"},"퇴사":{cls:"bdg-red",clr:"#DC2626",bg:"#FEF2F2"},"육아휴직":{cls:"bdg-purple",clr:"#7C3AED",bg:"#F5F3FF"},"육아기간 단축근로":{cls:"bdg-amber",clr:"#D97706",bg:"#FFFBEB"},"출산휴가":{cls:"bdg-pink",clr:"#BE185D",bg:"#FDF2F8"},"복직":{cls:"bdg-green",clr:"#16A34A",bg:"#F0FDF4"}};

function loadGTmpl(){
  try{const s=localStorage.getItem(GTMPL_KEY);if(s){const p=JSON.parse(s);if(p&&!Array.isArray(p))return p;}}catch(e){}
  const r={};Object.keys(DEF_SUBS).forEach(k=>{r[k]=DEF_SUBS[k].map(t=>({id:`g_${k.slice(0,3)}_${t.slice(0,8).replace(/\s/g,"_")}`,text:t}))});return r;
}
function saveGTmpl(t){try{localStorage.setItem(GTMPL_KEY,JSON.stringify(t))}catch(e){}}
function loadCL(mgr,tgt,tp,gTmpl){
  const k=clKey(mgr,tgt,tp);const gI=(gTmpl&&gTmpl[tp])||[];
  try{const raw=localStorage.getItem(k);if(raw){const sv=JSON.parse(raw);if(Array.isArray(sv)){
    const pers=sv.filter(x=>!x.isGlobal);
    const svGIds=new Set(sv.filter(x=>x.isGlobal).map(x=>x.gid||x.id));
    const newG=gI.filter(g=>!svGIds.has(g.id)).map(g=>({id:uid(),gid:g.id,text:g.text,done:false,isGlobal:true}));
    const syncG=sv.filter(x=>x.isGlobal).map(x=>{const m=gI.find(g=>g.id===(x.gid||x.id));return m?{...x,text:m.text}:null}).filter(Boolean);
    return [...pers,...syncG,...newG];
  }}}catch(e){}
  const defs=DEF_SUBS[tp]||[];const gTxts=new Set(gI.map(g=>g.text));
  return [...gI.map(g=>({id:uid(),gid:g.id,text:g.text,done:false,isGlobal:true})),...defs.filter(t=>!gTxts.has(t)).map(t=>({id:uid(),text:t,done:false,isGlobal:false}))];

function expandRoutine(routine,existing,team){
  const {id:rId,task,cycle,startDate,day,assignees,legal}=routine;
  const start=new Date(startDate||todayStr);
  const horizon=new Date(TODAY);horizon.setMonth(horizon.getMonth()+36);
  const hStart=new Date(TODAY);hStart.setMonth(hStart.getMonth()-24);
  let mi=1;
  if(cycle==="분기별")mi=3;
  else if(cycle==="반기별")mi=6;
  else if(cycle==="연간")mi=12;
  else if(cycle==="일회성")mi=null;
  const exKeys=new Set((existing||[]).filter(t=>t.routineId===rId).map(t=>t.routineKey));
  const res=[];
  const tIds=assignees==="all"?(team||[]).map(m=>m.id):(Array.isArray(assignees)?assignees:[]);
  const addDate=dt=>{
    const due=fmt(dt);
    tIds.forEach(mid=>{
      const k=`${rId}_${due}_${mid}`;
      if(exKeys.has(k))return;
      res.push({id:uid(),task,due,category:cycle,urgent:!!legal,legal:!!legal,asgn:mid,note:cycle+" 정기 일정",empId:null,name:"",dept:"",routineId:rId,routineKey:k,isRoutine:true});
    });
  };
  if(mi===null){
    const d=new Date(start.getFullYear(),start.getMonth(),day||1);
    if(d>=start&&d<=horizon)addDate(d);
  }else{
    const es=new Date(Math.max(start.getTime(),hStart.getTime()));
    let cur=new Date(es.getFullYear(),es.getMonth(),1);
    while(cur<=horizon){
      const dim=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
      const ad=Math.min(day||1,dim);
      const occ=new Date(cur.getFullYear(),cur.getMonth(),ad);
      if(occ>=start&&occ>=hStart&&occ<=horizon)addDate(occ);
      cur.setMonth(cur.getMonth()+mi);
    }
  }
  return res;
}

// ── SummaryBar ─────────────────────────────────────────────────────────────────
function SummaryBar({employees,tasks,ts,apiRows,selectedDate,calYear,calMonth}){
  const moStr=calYear+"-"+String(calMonth+1).padStart(2,"0");
  const empJoiners=(employees||[]).filter(e=>e.type==="입사"&&String(e.date||"").startsWith(moStr)).length;
  const empLeavers=(employees||[]).filter(e=>e.type==="퇴사"&&String(e.date||"").startsWith(moStr)).length;
  const yr=String(calYear);
  const mo2=String(calMonth+1).padStart(2,"0");
  const moNum=String(calMonth+1);
  function matchesMonth(rm){
    const s=String(rm||"").trim(); if(!s)return false;
    if(s.startsWith(yr+"."+mo2))return true;
    if(s.startsWith(yr+"-"+mo2))return true;
    if(s.startsWith(yr+"/"+mo2))return true;
    if(s===yr+"년 "+moNum+"월"||s===yr+"년 "+mo2+"월")return true;
    return false;
  }
  const apiMonthRows=(apiRows||[]).filter(r=>matchesMonth(r.reflectMonth));
  const apiJoiners=apiMonthRows.filter(r=>String(r.isReflected||"").trim()==="입사").length;
  const apiLeavers=apiMonthRows.filter(r=>String(r.isReflected||"").trim()==="퇴사").length;
  const joiners=empJoiners+apiJoiners;
  const leavers=empLeavers+apiLeavers;

  const urgent=(tasks||[]).filter(t=>t.urgent&&ts[t.id]!=="completed");
  const thisWeek=urgent.filter(t=>Math.ceil((new Date(t.due)-TODAY)/86400000)<=7);

  const dayTasks=(tasks||[]).filter(t=>t.due===selectedDate);
  const dayDone=dayTasks.filter(t=>ts[t.id]==="completed").length;
  const dayPct=dayTasks.length?Math.round(dayDone/dayTasks.length*100):0;

  const monthTasks=(tasks||[]).filter(t=>t.due&&String(t.due).startsWith(moStr));
  const monthDone=monthTasks.filter(t=>ts[t.id]==="completed").length;
  const monthPct=monthTasks.length?Math.round(monthDone/monthTasks.length*100):0;
  const monthLabel=KOR_M[calMonth]+" "+calYear;

  return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:12,marginBottom:14}}>
    <div className="stat-card">
      <div className="stat-label">{monthLabel+" 입퇴사"}</div>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{textAlign:"center"}}><div className="stat-value" style={{color:"#1D4ED8",fontSize:20}}>{"+"+joiners}</div><div className="stat-sub">입사</div></div>
        <div style={{width:1,height:32,background:"var(--border2)"}}/>
        <div style={{textAlign:"center"}}><div className="stat-value" style={{color:"#DC2626",fontSize:20}}>{"-"+leavers}</div><div className="stat-sub">퇴사</div></div>
        <div style={{width:1,height:32,background:"var(--border2)"}}/>
        <div style={{textAlign:"center"}}><div className="stat-sub">순증</div><div className="stat-value" style={{color:joiners-leavers>=0?"#16A34A":"#DC2626",fontSize:20}}>{(joiners-leavers>=0?"+":"")+String(joiners-leavers)}</div></div>
      </div>
    </div>
    <div className="stat-card" style={{borderTopColor:thisWeek.length>0?"#EF4444":"var(--sky)"}}>
      <div className="stat-label" style={{color:thisWeek.length>0?"#DC2626":"var(--t3)"}}>긴급 마감</div>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <div className="stat-value" style={{color:thisWeek.length>0?"#EF4444":"var(--t3)",fontSize:30}}>{thisWeek.length}</div>
        <div><div className="stat-sub">건 이번 주 마감</div>{thisWeek.slice(0,2).map(t=><div key={t.id} style={{fontSize:10,color:"#DC2626",marginTop:2}}>{dday(t.due)+" · "+t.task}</div>)}</div>
      </div>
    </div>
    <div className="stat-card" style={{borderTopColor:"#8B5CF6"}}>
      <div className="stat-label" style={{color:"#8B5CF6"}}>당일 진행률</div>
      <div style={{display:"flex",alignItems:"flex-end",gap:8,marginBottom:8}}>
        <div className="stat-value" style={{color:"#8B5CF6",fontSize:30}}>{dayPct+"%"}</div>
        <div className="stat-sub" style={{marginBottom:3}}>{dayDone+"/"+dayTasks.length}</div>
      </div>
      <PBar pct={dayPct} color="#8B5CF6" h={6}/>
    </div>
    <div className="stat-card" style={{borderTopColor:"#0EA5E9"}}>
      <div className="stat-label" style={{color:"var(--sky-d)"}}>월 진행률</div>
      <div style={{display:"flex",alignItems:"flex-end",gap:8,marginBottom:8}}>
        <div className="stat-value" style={{color:"var(--sky-d)",fontSize:30}}>{monthPct+"%"}</div>
        <div className="stat-sub" style={{marginBottom:3}}>{monthDone+"/"+monthTasks.length}</div>
      </div>
      <PBar pct={monthPct} h={6}/>
    </div>
  </div>;
}

function ScheduleForm({team,onSubmit,onCancel,initCycle,showCancel}){
  const[task,setTask]=useState("");

  const[startDate,setStartDate]=useState(todayStr);
  const[day,setDay]=useState(15);

  const[assigneeMode,setAssigneeMode]=useState("all");
  const[selMem,setSelMem]=useState([]);

    if(!task.trim()){setErr("일정명을 입력해주세요.");return;}
    if(assigneeMode==="selected"&&selMem.length===0){setErr("담당자를 1명 이상 선택해주세요.");return;}
    const assignees=assigneeMode==="all"?"all":selMem;

  return <div>
    <FR label="일정명"><input className="inp" placeholder="예: 4대보험 취득신고" value={task} onChange={e=>setTask(e.target.value)}/></FR>

        {CYCLE_OPTS.map(c=><button key={c} onClick={()=>setCycle(c)} style={{padding:"5px 12px",borderRadius:8,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit",border:"1.5px solid "+(cycle===c?(CYCLE_CLR[c]||"var(--sky)"):"var(--border2)"),background:cycle===c?(CYCLE_CLR[c]||"var(--sky)")+"15":"#fff",color:cycle===c?(CYCLE_CLR[c]||"var(--sky)"):"var(--t3)"}}>{c}</button>)}
      </div>
    </FR>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <FR label={cycle==="일회성"?"날짜":"시작 날짜"}><input type="date" className="inp" value={startDate} onChange={e=>setStartDate(e.target.value)}/></FR>

      <div style={{display:"flex",gap:8}}>
        {[["false","일반"],["true","법정"]].map(([v,l])=><button key={v} onClick={()=>setLegal(v==="true")} style={{padding:"5px 12px",borderRadius:8,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit",border:"1.5px solid "+(String(legal)===v?"#EF4444":"var(--border2)"),background:String(legal)===v?"#FEF2F2":"#fff",color:String(legal)===v?"#EF4444":"var(--t3)"}}>{l}</button>)}

    <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:14}}>

      </div>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}}>
      {(team||[]).map(m=>{
        const myTasks=allDayTasks.filter(t=>t.asgn===m.id);
        const myDone=myTasks.filter(t=>ts[t.id]==="completed").length;

          </div>
          <div style={{marginBottom:8}}><PBar pct={myPct} color={m.color}/></div>
          <div style={{maxHeight:200,overflowY:"auto"}}>
            {myTasks.map(t=>(
              <div key={t.id} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 0",borderBottom:"1px solid #f0f0f0"}}>
                <Chk checked={ts[t.id]==="completed"} onChange={()=>onToggle(t.id)} color={m.color}/>
                <span style={{fontSize:11,textDecoration:ts[t.id]==="completed"?"line-through":"none",flex:1}}>{t.task}</span>
                <DelBtn onClick={()=>onDelete(t.id)}/>

            {myTasks.length===0&&<div style={{fontSize:11,color:"var(--t3)",textAlign:"center",padding:"10px 0"}}>배정된 업무 없음</div>}
          </div>
        </div>;

    {quickAdd&&<Modal title={quickAdd.name+" 실시간 업무 등록"} onClose={()=>setQuickAdd(null)}>
      <FR label="업무 내용"><input className="inp" placeholder="예: 4대보험 취득 정산 확인" value={taskText} onChange={e=>setTaskText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleAddQuickTask()}/></FR>

  return <div className="fadein">
    <div className="card" style={{padding:12}}>
      <select className="inp" style={{width:"auto",display:"inline-block",marginRight:10}} value={fMonth} onChange={e=>setFMonth(e.target.value)}><option value="ALL">전체 월 조회</option>{months.map(m=><option key={m} value={m}>{m}</option>)}</select>
      <span style={{fontSize:11,color:"var(--t3)"}}>구글 시트 연동 인원: {filtered.length}명 조회됨</span>
    </div>
    <div className="card">
      <table className="xtbl">
        <thead>
          <tr><th class="xcl">행 번호</th><th class="xcl">반영월</th><th class="xcl">담당자</th><th class="xcl">대상자</th><th class="xcl">내용</th><th class="xcl">금액</th><th class="xcl">기타</th></tr>
        </thead>
        <tbody>
          {filtered.map((r,i)=><tr key={i}>
            <td className="rnum">{r.rowIndex}</td>
            <td>{r.reflectMonth}</td>
            <td>{r.manager}</td>
            <td style={{fontWeight:700}}>{r.targetName}</td>
            <td>{r.content}</td>
            <td className="amt">{fmtAmt(r.amount)}</td>
            <td>{r.etc||"—"}</td>
          </tr>)}
        </tbody>
      </table>
    </div>
  </div>;
}

// ── PageMemo — 특이사항 관리 ─────────────────────────────────────────────────
function PageMemo({memos, onAddMemo, onDelMemo, selectedDate}){
  const[author,setAuthor]=useState("박혜연");
  const[content,setContent]=useState("");
  const[remark,setRemark]=useState("");

  function submit(){
    if(!content.trim()) return alert("업무 특이사항 내용을 기입하세요.");
    onAddMemo({author,cat:"일반 메모",date:selectedDate,content:content.trim(),remark:remark.trim()});
    setContent(""); setRemark("");
  }

  return <div className="fadein">
    <div className="card" style={{padding:16}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 2fr 1fr",gap:10,marginBottom:10}}>
        <div><div className="inp-lbl">기록자</div><input className="inp" value={author} onChange={e=>setAuthor(e.target.value)}/></div>
        <div><div className="inp-lbl">이슈 및 특이사항 내용</div><input className="inp" placeholder="실시간 공유할 내용 입력" value={content} onChange={e=>setContent(e.target.value)}/></div>
        <div><div className="inp-lbl">비고</div><input className="inp" placeholder="추가 전달사항" value={remark} onChange={e=>setRemark(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()}/></div>
      </div>
      <button className="btn btn-primary" onClick={submit}>+ Firebase 실시간 저장</button>
    </div>
    <div className="card">
      <table className="xtbl">
        <thead>
          <tr><th class="xcl">번호</th><th class="xcl">작성자</th><th class="xcl">관측일</th><th class="xcl">특이사항 내용</th><th class="xcl">비고</th><th class="xcl">삭제</th></tr>
        </thead>
        <tbody>
          {memos.map((m,idx)=><tr key={m.id}>
            <td className="rnum">{idx+1}</td>
            <td style={{fontWeight:600}}>{m.author}</td>
            <td>{m.date}</td>
            <td>{m.content}</td>
            <td style={{color:"var(--t3)"}}>{m.remark||"—"}</td>
            <td style={{textAlign:"center"}}><button className="btn btn-danger btn-sm" onClick={()=>onDelMemo(m.id)}>×</button></td>
          </tr>)}
          {memos.length===0&&<tr><td colSpan={6} style={{textAlign:"center",padding:20,color:"var(--t3)"}}>실시간 공유된 메모가 존재하지 않습니다.</td></tr>}
        </tbody>
      </table>
    </div>
  </div>;
}

// ── Page4보험 — 4대보험 검증 ─────────────────────────────────────────────────
function Page4Insurance(){
  return <div style={{textAlign:"center",padding:40}} className="fadein">
    <div style={{fontSize:32}}>◉</div>
    <div style={{fontSize:14,fontWeight:700,marginTop:10}}>4대보험 고지서 교차 검증 시스템</div>
    <div style={{fontSize:12,color:"var(--t3)",marginTop:6,lineHeight:1.6}}>
      공단 고지서(.xlsx) 원본 데이터와 급여대장을 대조하는 화면입니다.<br/>
      이 화면의 엑셀 데이터 분석 연산은 브라우저 보안 규정 및 성능 최적화를 위해<br/>
      사용자 로컬 세션에서 독립적으로 수행됩니다.
    </div>
  </div>;
}

// ── Main App Component ─────────────────────────────────────────────────────────
function App(){
  const[page,setPage]=useState("home");
  const[team,setTeam]=useState(DEF_TEAM);
  const[employees,setEmployees]=useState([]);
  const[tasks,setTasks]=useState([]);
  const[ts,setTs]=useState({});
  const[memos,setMemos]=useState([]);
  const[routines,setRoutines]=useState([]);
  
  const[calYear,setCalYear]=useState(()=>new Date().getFullYear());
  const[calMonth,setCalMonth]=useState(()=>new Date().getMonth());
  const[selectedDate,setSelectedDate]=useState(()=>todayStr);
  const[modal,setModal]=useState(null);
  const[adminName,setAdminName]=useState("박혜연");
  const[toast,setToast]=useState(null);
  const[apiRows,setApiRows]=useState([]);
  const[apiStatus,setApiStatus]=useState("idle");
  const[apiUrl,setApiUrl]=useState(API_URL);
  const[gTmpl,setGTmpl]=useState(()=>loadGTmpl());

  // ── Firebase Realtime 데이터 스트리밍 연동 (핵심) ──
  useEffect(() => {
    // 1. 테스크 스트리밍 수신
    const tasksRef = db.ref("hr_shine_desk/tasks");
    tasksRef.on("value", (snapshot) => {
      const data = snapshot.val();
      if (data) {
        const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        setTasks(list);
      } else {
        setTasks([]);
      }
    });

    // 2. 체크박스 상태 스트리밍 수신
    const tsRef = db.ref("hr_shine_desk/task_statuses");
    tsRef.on("value", (snapshot) => {
      const data = snapshot.val();
      if (data) { setTs(data); } else { setTs({}); }
    });

    // 3. 정기 루틴 템플릿 스트리밍 수신
    const routinesRef = db.ref("hr_shine_desk/routines");
    routinesRef.on("value", (snapshot) => {
      const data = snapshot.val();
      if (data) {
        const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        setRoutines(list);
      } else {
        setRoutines([]);
      }
    });

    // 4. 특이사항 메모 스트리밍 수신
    const memosRef = db.ref("hr_shine_desk/memos");
    memosRef.on("value", (snapshot) => {
      const data = snapshot.val();
      if (data) {
        const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        setMemos(list);
      } else {
        setMemos([]);
      }
    });

    return () => {
      tasksRef.off();
      tsRef.off();
      routinesRef.off();
      memosRef.off();
    };
  }, []);

  // 전역 함수 노출 (Team 탭 등에서 호출 가능케 인터페이스 브릿지)
  useEffect(() => {
    window.__addTask = (newTask) => {
      const id = newTask.id || uid();
      db.ref("hr_shine_desk/tasks/" + id).set(newTask);
      db.ref("hr_shine_desk/task_statuses/" + id).set("pending");
      setToast("실시간 서버 일정 등록 완료");
    };
    return () => { delete window.__addTask; };
  }, []);

  const handleToggle = useCallback((id) => {
    const currentStatus = ts[id] === "completed" ? "pending" : "completed";
    db.ref("hr_shine_desk/task_statuses/" + id).set(currentStatus);
  }, [ts]);

  const handleDelete = useCallback((id) => {
    db.ref("hr_shine_desk/tasks/" + id).remove();
    db.ref("hr_shine_desk/task_statuses/" + id).remove();
    setToast("업무 삭제 반영됨");
  }, []);

  function handleAddSchedules(payload){
    if(!payload) return;
    if(payload.kind === "tasks"){
      const tks = payload.tasks || [];
      tks.forEach(t => {
        db.ref("hr_shine_desk/tasks/" + t.id).set(t);
        db.ref("hr_shine_desk/task_statuses/" + t.id).set("pending");
      });
      setToast("일정 " + tks.length + "개 분산 업로드 완료");
    } else if(payload.kind === "routine"){
      const newId = uid();
      const nr = { task: payload.task, cycle: payload.cycle, startDate: payload.startDate, day: payload.day, legal: payload.legal, assignees: payload.assignees };
      db.ref("hr_shine_desk/routines/" + newId).set(nr);

      const ne = expandRoutine({ id: newId, ...nr }, [...tasks], team);
      ne.forEach(t => {
        db.ref("hr_shine_desk/tasks/" + t.id).set(t);
        db.ref("hr_shine_desk/task_statuses/" + t.id).set("pending");
      });
      setToast("정기 반복 일정 마스터 동기화 완료");
    }
  }

  function handleDeleteRoutine(rid){
    db.ref("hr_shine_desk/routines/" + rid).remove();
    // 해당 루틴에서 파생된 서브 타스크 일괄 제거
    tasks.forEach(t => {
      if(t.routineId === rid) {
        db.ref("hr_shine_desk/tasks/" + t.id).remove();
        db.ref("hr_shine_desk/task_statuses/" + t.id).remove();
      }
    });
    setToast("정기 루틴 삭제 완료");
  }

  function handleEditRoutine(rid, payload){
    db.ref("hr_shine_desk/routines/" + rid).set(payload);
    setToast("루틴 마스터 템플릿 수정됨");
  }

  function handleAddMemo(memoObj){
    const newId = uid();
    db.ref("hr_shine_desk/memos/" + newId).set({ ...memoObj, createdAt: nowIso() });
    setToast("실시간 공용 메모 전송 완료");
  }

  function handleDelMemo(mid){
    db.ref("hr_shine_desk/memos/" + mid).remove();
    setToast("메모 삭제 완료");
  }

  function handleRefresh(){
    setApiStatus("loading");
    fetch(apiUrl).then(r=>r.json()).then(data=>{
      const rows=Array.isArray(data)?data:(data.data||[]);
      setApiRows(rows.map((r,i)=>({rowIndex:r.rowIndex||(i+2),...r})));
      setApiStatus("ok");
    }).catch(()=>setApiStatus("err"));
  }

  const calOnNav = dir => setCalMonth(m => { let nm=m+dir; if(nm>11){setCalYear(y=>y+1); return 0} if(nm<0){setCalYear(y=>y-1); return 11} return nm; });
  const moveCount = (apiRows||[]).filter(r=>MOVE_TYPES.includes(String(r.isReflected||"").trim())).length;
  const histPend = (apiRows||[]).filter(r=>r.verify1Done&&!r.verify2Done).length;

  const NAV = [
    {key:"home",label:"전체 워크플로우",icon:"⊞"},
    {key:"ob",label:"인사이동 관리",icon:"↔",badge:moveCount,bCls:"sky"},
    {key:"team",label:"팀원별 진척도",icon:"◈"},
    {key:"history",label:"업무 이력",icon:"≡",badge:histPend},
    {key:"memo",label:"특이사항 관리",icon:"✎"},
    {key:"insurance",label:"4대보험 검증",icon:"◉"}
  ];
  const PMETA = {
    home:{title:"HRM 업무 관리 대시보드",sub:"실시간 클라우드 연동 상태"},
    ob:{title:"인사이동 관리",sub:"체크리스트 루틴 트래킹"},
    team:{title:"팀원별 진척도",sub:"당일 실시간 완료 트래킹"},
    history:{title:"업무 이력",sub:"Google Sheets 동기화 기록"},
    memo:{title:"특이사항 관리",sub:"실시간 전사 HR 공유 메모창"},
    insurance:{title:"4대보험 검증",sub:"고지서 교차 분석"}
  };

  return <div className="bw">
    <div className="bchrome">
      <div className="btb">
        <div className="bdots"><div className="bd r"/><div className="bd y"/><div className="bd g"/></div>
        <div className="baddr" style={{flex:1}}><span>{"hr-shine-desk.firebase.app / " + page}</span><div style={{flex:1}}/><span style={{fontSize:10,color:"#94A3B8"}}>HR SHINE DESK v16 CLOUD</span></div>
      </div>
      <div className="btabs"><div className="btab active">HR SHINE DESK Cloud — {(PMETA[page]||{}).title}</div></div>
    </div>
    <div className="bcontent">
      <div className="shell">
        <aside className="sidebar">
          <div className="sb-logo">
            <div className="sb-logo-icon"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" fill="white"/><rect x="9" y="1" width="6" height="6" rx="1.5" fill="white" opacity=".7"/></svg></div>
            <div className="sb-logo-t">HR SHINE DESK</div>
            <div className="sb-logo-s">v16 Firebase Server</div>
          </div>
          <div className="sb-sec">워크스페이스</div>
          <nav className="sb-nav">
            {NAV.map(({key,label,icon,badge,bCls})=><button key={key} className={"nav-item"+(page===key?" active":"")} onClick={()=>setPage(key)}>
              <span>{icon}</span><span style={{flex:1,marginLeft:6}}>{label}</span>
              {badge>0&&<span className={"nav-badge"+(bCls?" "+bCls:"")}>{badge}</span>}
            </button>)}
          </nav>
          <div className="sb-footer">
            <div style={{fontSize:10,color:"rgba(255,255,255,.5)",display:"flex",alignItems:"center",gap:5}}><div className="ldot"/>Firebase 실시간 연결됨</div>
          </div>
        </aside>
        <div className="main">
          <header className="topbar">
            <div>
              <div style={{fontSize:14,fontWeight:800,color:"var(--sky-deep)"}}>{(PMETA[page]||{}).title}</div>
              <div style={{fontSize:10,color:"var(--t3)"}}>{(PMETA[page]||{}).sub}</div>
            </div>
            <div style={{display:"flex",gap:6}}>
              <button className="btn btn-ghost" style={{fontSize:11}} onClick={()=>setModal("routine")}>정기 일정 관리</button>
              <button className="btn btn-primary" style={{fontSize:11}} onClick={()=>setModal("schedule")}>+ 일정 추가</button>
            </div>
          </header>
          <main className="pgcont">
            {page==="home"&&<PageHome employees={employees} tasks={tasks} ts={ts} apiRows={apiRows} team={team} calYear={calYear} calMonth={calMonth} onCalNav={calOnNav} onToggle={handleToggle} onDelete={handleDelete} onAddCal={setSelectedDate} selectedDate={selectedDate} onSelectDate={setSelectedDate}/>}
            {page==="ob"&&<PageOB apiRows={apiRows} apiStatus={apiStatus} team={team} onRefresh={handleRefresh} gTmpl={gTmpl} setGTmpl={setGTmpl}/>}
            {page==="team"&&<PageTeam tasks={tasks} ts={ts} team={team} onToggle={handleToggle} onDelete={handleDelete} onUpdateTeam={setTeam} selectedDate={selectedDate} onSelectDate={setSelectedDate}/>}
            {page==="history"&&<PageHistory adminName={adminName} setAdminName={setAdminName} apiRows={apiRows} setApiRows={setApiRows} apiStatus={apiStatus} setApiStatus={setApiStatus} apiUrl={apiUrl} setApiUrl={setApiUrl}/>}
            {page==="memo"&&<PageMemo memos={memos} onAddMemo={handleAddMemo} onDelMemo={handleDelMemo} selectedDate={selectedDate}/>}
            {page==="insurance"&&<Page4Insurance/>}
          </main>
        </div>
      </div>
    </div>
    {modal==="schedule"&&<ScheduleModal team={team} onClose={()=>setModal(null)} onAddSchedules={handleAddSchedules}/>}
    {modal==="routine"&&<RoutineManagerModal routines={routines} team={team} onClose={()=>setModal(null)} onDelete={handleDeleteRoutine} onEdit={handleEditRoutine} onAdd={handleAddSchedules} onReset={()=>{db.ref("hr_shine_desk/routines").remove(); setToast("루틴 마스터 전면 리셋됨"); setModal(null);}}/>}
    {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
